<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Gateway Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --card-bg: #18181b;
            --border: #27272a;
            --text: #fafafa;
            --text-muted: #a1a1aa;
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            font-size: 0.875rem;
            font-weight: 500;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 1rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .stat-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        .provider-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .provider-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 0.75rem;
        }

        .provider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            text-transform: capitalize;
            font-weight: 600;
        }

        .provider-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
        }

        .pill {
            padding: 0.25rem 0.625rem;
            border-radius: 0.375rem;
            font-weight: 500;
        }

        .pill-active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .pill-cooldown {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .pill-fail {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

        .model-list {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 1rem;
            height: fit-content;
        }

        .model-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0;
            font-size: 0.875rem;
            border-bottom: 1px solid var(--border);
        }

        .model-item:last-child {
            border-bottom: none;
        }

        .dot {
            height: 6px;
            width: 6px;
            background: var(--primary);
            border-radius: 50%;
        }

        .keys-container {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }

        .key-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.5rem;
            padding: 0.75rem;
        }

        .key-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .key-header .hash {
            color: var(--text-muted);
            font-family: monospace;
            font-size: 0.75rem;
            margin-left: 0.5rem;
            flex-grow: 1;
        }

        .status-indicator {
            height: 8px;
            width: 8px;
            border-radius: 50%;
        }

        .active-dot {
            background: var(--success);
        }

        .cooldown-dot {
            background: var(--warning);
        }

        .key-metrics {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .usage-bar-container {
            margin-top: 0.375rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 9999px;
            height: 4px;
            overflow: hidden;
        }

        .usage-bar {
            height: 100%;
            border-radius: 9999px;
            transition: width 0.6s ease, background-color 0.6s ease;
        }

        .usage-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>LLM Gateway Dashboard</h1>
            <div id="status" class="status-badge">
                <span class="dot" style="background: var(--success)"></span>
                System Operational
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Active Keys</div>
                <div id="active_keys" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Models</div>
                <div id="active_models" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Today's Requests</div>
                <div id="total_requests" class="stat-value">0</div>
            </div>
        </div>

        <div class="grid-layout">
            <div class="providers-section">
                <h2 class="section-title">Provider Health</h2>
                <div id="provider_grid" class="provider-grid">
                    <!-- Providers will be injected here -->
                </div>
            </div>

            <div class="models-section">
                <h2 class="section-title">Active Models</h2>
                <div id="model_list" class="model-list">
                    <!-- Models will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        async function updateDashboard() {
            try {
                const response = await fetch('/health');
                const data = await response.json();

                // Update Overview
                document.getElementById('active_keys').textContent = data.active_keys;
                document.getElementById('active_models').textContent = data.active_models;
                document.getElementById('total_requests').textContent = data.total_requests_today;

                // Update Status
                const statusBadge = document.getElementById('status');
                statusBadge.innerHTML = `<span class="dot" style="background: ${data.status === 'operational' ? 'var(--success)' : 'var(--warning)'}"></span> System ${data.status}`;
                statusBadge.style.color = data.status === 'operational' ? 'var(--success)' : 'var(--warning)';
                statusBadge.style.background = data.status === 'operational' ? 'rgba(16, 185, 129, 0.1)' : 'rgba(245, 158, 11, 0.1)';

                // Update Providers
                const providerGrid = document.getElementById('provider_grid');
                providerGrid.innerHTML = Object.entries(data.provider_health).map(([name, stats]) => {
                    const keysHtml = (stats.keys || []).map(k => {
                        let cooldownText = '';
                        if (k.status === 'cooldown' && k.cooldown_until) {
                            const dt = new Date(k.cooldown_until + 'Z'); // ensure it's treated as UTC if possible, or naive UTC from python
                            const now = new Date();
                            // Using a simple check because timezone formats vary, backend passes standard ISO.
                            let seconds = Math.max(0, Math.floor((dt - now) / 1000));
                            cooldownText = ` <span style="color:var(--warning);font-weight:600;">(wait ${seconds}s)</span>`;
                        }

                        return `
                        <div class="key-item">
                            <div class="key-header">
                                <strong>${k.model_id}</strong> <span class="hash">[${k.hash}]</span>
                                <span class="status-indicator ${k.status === 'active' ? 'active-dot' : 'cooldown-dot'}" title="${k.status}"></span>
                            </div>
                            <div class="key-metrics">
                                <span>Uses today: ${k.daily_requests}</span>
                                <span>Fails: ${k.fail_count}${cooldownText}</span>
                            </div>
                            ${(() => {
                                const used = k.daily_requests;
                                const limit = k.daily_limit;
                                const liveRemaining = k.ratelimit_remaining; // bonus if provider sends headers

                                if (limit) {
                                    const pct = Math.min(100, Math.round((used / limit) * 100));
                                    const color = pct >= 90 ? 'var(--error)' : pct >= 60 ? 'var(--warning)' : 'var(--success)';
                                    const liveBadge = (liveRemaining != null && liveRemaining !== 999)
                                        ? `<span style="color:var(--primary);font-weight:600;">· ${liveRemaining} API remaining</span>`
                                        : '';
                                    return `
                                    <div class="usage-bar-container">
                                        <div class="usage-bar" style="width:${pct}%;background:${color};"></div>
                                    </div>
                                    <div class="usage-label">
                                        <span>${used} / ${limit} requests today ${liveBadge}</span>
                                        <span>${pct}%</span>
                                    </div>`;
                                } else {
                                    // No limit configured — just show raw count
                                    return `<div class="usage-label" style="justify-content:flex-start;">
                                        <span>${used} requests today (no daily limit set)</span>
                                    </div>`;
                                }
                            })()}
                        </div>
                        `;
                    }).join('');

                    return `
                    <div class="provider-card">
                        <div class="provider-header">${name}</div>
                        <div class="provider-stats">
                            <span class="pill pill-active">${stats.active} Active</span>
                            <span class="pill pill-cooldown">${stats.cooldown} Cooldown</span>
                            <span class="pill pill-fail">${stats.fail_count} Fails</span>
                        </div>
                        <div class="keys-container">
                            ${keysHtml}
                        </div>
                    </div>
                    `;
                }).join('');

                // Update Models
                const modelList = document.getElementById('model_list');
                modelList.innerHTML = data.active_model_list.map(model => `
                    <div class="model-item">
                        <span class="dot"></span>
                        ${model}
                    </div>
                `).join('') || '<div class="stat-label">No active models</div>';

            } catch (error) {
                console.error('Failed to update dashboard:', error);
            }
        }

        // Update every 60 seconds
        setInterval(updateDashboard, 60000);
        updateDashboard();
    </script>
</body>

</html>
